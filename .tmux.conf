# ~/.tmux.conf

#############################
### General / behaviour   ###
#############################

# True color + correct terminal
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -as terminal-features ",alacritty:RGB"
# undercurl + colored underlines (nvim diagnostics) inside tmux
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p2%{256}%/%d::%p3%d%;m'

# Big scrollback
set-option -g history-limit 100000

# Avoid ESC delay (good for nvim)
set -s escape-time 0

# Let nvim see focus changes (autoread, etc.)
set -g focus-events on

# Index windows/panes from 1, keep them renumbered
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Titles
set -g set-titles on
set -g set-titles-string "#T"

# Mouse
set -g mouse on

# vi everywhere
set -g mode-keys vi
set -g status-keys vi

# System clipboard integration
set -g set-clipboard on

# Refresh status periodically
set -g status-interval 5

# Activity highlight (no popup)
setw -g monitor-activity on
set -g visual-activity off

#############################
### Key bindings (QoL)    ###
#############################

# Reload config
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Splits/new-window keep the current path; intuitive split keys
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Move between panes with vi keys (prefix)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window navigation without prefix
bind -n C-S-Left previous-window
bind -n C-S-Right next-window

# Toggle the status bar
bind b set-option status

#############################
### Copy mode (vi)        ###
#############################

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
bind -T copy-mode-vi Enter send-keys -X cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe 'xclip -in -selection clipboard'

# Copy the whole buffer to clipboard (e.g. after a mouse selection)
bind -nr C-y run "tmux show-buffer | xclip -in -selection clipboard"

#############################
### Tokyo Night (night)   ###
#############################
# bg #1a1b26  fg #c0caf5  dark5 #737aa2  bright-black #414868
# blue #7aa2f7  cyan #7dcfff  orange #ff9e64

set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#1a1b26,fg=#c0caf5"

# Left: session name pill
set -g status-left-length 40
set -g status-left "#[fg=#1a1b26,bg=#7aa2f7,bold] #S #[fg=#7aa2f7,bg=#1a1b26]"

# Right: date + time pill
set -g status-right-length 80
set -g status-right "#[fg=#414868,bg=#1a1b26]#[fg=#c0caf5,bg=#414868] %Y-%m-%d #[fg=#7aa2f7,bg=#414868]#[fg=#1a1b26,bg=#7aa2f7,bold] %H:%M "

# Windows
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#737aa2,bg=#1a1b26] #I:#W#F "
setw -g window-status-current-format "#[fg=#7dcfff,bg=#1a1b26]#[fg=#1a1b26,bg=#7dcfff,bold] #I:#W#F #[fg=#7dcfff,bg=#1a1b26]"
setw -g window-status-activity-style "fg=#ff9e64,bg=#1a1b26"

# Panes
set -g pane-border-style "fg=#414868"
set -g pane-active-border-style "fg=#7aa2f7"

# Messages / command prompt
set -g message-style "bg=#7aa2f7,fg=#1a1b26"
set -g message-command-style "bg=#7aa2f7,fg=#1a1b26"

# Copy-mode selection + clock
setw -g mode-style "bg=#283457,fg=#c0caf5"
setw -g clock-mode-colour "#7aa2f7"

#############################
### Plugins (tpm)         ###
#############################
# IMPORTANT: @plugin lines must come before `run tpm`.
# First-time setup: start tmux, then press  <prefix> I  to install.
# resurrect:  <prefix> Ctrl-s = save,  <prefix> Ctrl-r = restore.

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# Initialize tpm — keep this at the very bottom.
run -b '~/.tmux/plugins/tpm/tpm'
